<!--
  ════════════════════════════════════════════════════════
  SOLUCIÓ DE REFERÈNCIA — NOMÉS PER AL PROFESSOR
  No apareix en cap data-code visible a l'alumne.
  ════════════════════════════════════════════════════════

while front_is_clear():
    if pearl_here():
        grab()
    move()
if pearl_here():
    grab()

  Nota: la iteració while comprova front_is_clear() ABANS de moure's.
  Quan la condició és falsa, en Karel és a l'última casella però
  encara no l'ha comprovat per perles. El if final fora del while
  és el "error de límit fix": gestiona exactament aquesta última casella.

  Error habitual de l'alumne: posar el grab() dins del move(), o
  comprovar pearl_here() DESPRÉS de move() (que ja ha avançat).
  La solució correcta comprova PRIMER si hi ha perla, DESPRÉS mou.
  ════════════════════════════════════════════════════════
-->
