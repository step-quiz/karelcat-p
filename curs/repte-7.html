<!--
  ════════════════════════════════════════════════════════
  SOLUCIÓ DE REFERÈNCIA — NOMÉS PER AL PROFESSOR
  No apareix en cap data-code visible a l'alumne.
  ════════════════════════════════════════════════════════

def puja_grao():
    move()
    turn_left()
    move()
    turn_right()

def baixa_grao():
    turn_right()
    move()
    turn_left()
    move()

while not pearl_here():
    puja_grao()

grab()

while front_is_clear():
    baixa_grao()

drop()

  Traça d'execució (Test A — 5×3, N=2 graons)
    Inici: en Karel a (col=0, fil=2) mirant Est.  Pearl a (col=2, fil=0).
    [fil=0 = cim; fil=2 = peu]

    Pujada:
      pearl_here() a (0,2) = False → puja_grao:
        move→(1,2), turn_left→N, move→(1,1), turn_right→E.  en Karel a (1,1).
      pearl_here() a (1,1) = False → puja_grao:
        move→(2,1), turn_left→N, move→(2,0), turn_right→E.  en Karel a (2,0).
      pearl_here() a (2,0) = True → surt del while.

    grab()  →  la casella (2,0) queda buida; en Karel porta 1 perla.

    Baixada:
      front_is_clear() a (2,0) Est = True (col 3, fil 0 és .)
        → baixa_grao: turn_right→S, move→(2,1), turn_left→E, move→(3,1).
          En Karel a (3,1) Est.
      front_is_clear() a (3,1) Est = True (col 4, fil 1 és .)
        → baixa_grao: turn_right→S, move→(3,2), turn_left→E, move→(4,2).
          En Karel a (4,2) Est.
      front_is_clear() a (4,2) Est = False (paret del món, amplada=5) → surt.

    drop()  →  perla a (4,2).  en Karel queda a (4,2) Est.  ✓

  Perquè funciona per a N=3 (Test B, 7×4) i N=4 (Test C, 9×5):
    · while not pearl_here() s'atura exactament quan en Karel arriba al cim,
      independentment de quants graons hi hagi.
    · while front_is_clear() s'atura quan en Karel ha acabat de baixar
      (la paret dreta del món tanca el recorregut).
    · puja_grao() i baixa_grao() comparteixen la mateixa
      pre/postcondició (peu d'un graó, mirant Est), de manera que
      encadenar-les amb while és trivial i no cal cap comptador.

  Errors habituals de l'alumne:
    · Implementar baixa_grao() com una còpia de puja_grao() (sense invertir).
      → en Karel torna a pujar en comptes de baixar.
    · Oblidar turn_right() al principi de baixa_grao().
      → en Karel intenta moure's Est quan hauria d'anar al Sud i xoca.
    · Usar while front_is_clear(): puja_grao() en comptes de
      while not pearl_here().
      → En un món obert (sense parets internes), front_is_clear() és
         sempre True fins a la paret del món; en Karel surt del món.
    · Oblidar drop() al final.
      → El simulador accepta el recorregut però la perla no apareix al peu.

  Clau pedagògica:
    La simetria puja_grao ↔ baixa_grao és la idea central del repte.
    Un alumne que entén que baixa_grao() és l'invers pas a pas de
    puja_grao() pot escriure'l immediatament. Un alumne que el copia
    i modifica aleatòriament sol necessitar múltiples intents.
    La condició while not pearl_here() és un exemple de "condició
    de parada basada en l'estat del món" (no en un comptador), igual
    que al repte del laberint (repte 9).
  ════════════════════════════════════════════════════════
