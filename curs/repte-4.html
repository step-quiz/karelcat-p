<!--
  ════════════════════════════════════════════════════════
  SOLUCIÓ DE REFERÈNCIA — NOMÉS PER AL PROFESSOR
  No apareix en cap data-code visible a l'alumne.
  ════════════════════════════════════════════════════════

while not bag_is_empty():
    drop()
    move()

  Traça d'execució (passadís de 6 caselles, bag=5):
    Inici:  casella 0 → Est, motxilla=5
    Iter 1: bag_is_empty()=F → drop a 0 · move → casella 1, motxilla=4
    Iter 2: bag_is_empty()=F → drop a 1 · move → casella 2, motxilla=3
    Iter 3: bag_is_empty()=F → drop a 2 · move → casella 3, motxilla=2
    Iter 4: bag_is_empty()=F → drop a 3 · move → casella 4, motxilla=1
    Iter 5: bag_is_empty()=F → drop a 4 · move → casella 5, motxilla=0
    Iter 6: bag_is_empty()=T → surt del while
    Final:  casella 5 → Est, perles a 0–4  ✓

  Perquè funcioni: el passadís té sempre una casella extra al final
  (N+1 caselles per a N perles). Gràcies a això, l'últim move() no
  xoca contra cap paret.

  Errors habituals de l'alumne:
    · Usar front_is_clear() com a condició: pot parar massa aviat o
      massa tard, depenent de la longitud del passadís.
    · Invertir l'ordre: move() ABANS de drop() → la primera casella
      queda sense perla i l'última move() surt de bounds.
    · Oblidar el move() dins el while: en Karel col·loca totes les perles
      a la mateixa casella (drop() repetit al mateix lloc, però el motor
      no permet dos drops al mateix lloc → error 'pearl_here').

  Clau pedagògica: la motxilla és el "comptador" que el programa no té.
  Usar bag_is_empty() desacobla la condició de parada de la geometria
  del món. El mateix codi funciona per a qualsevol longitud de passadís
  sempre que hi hagi la casella de marge final.
  ════════════════════════════════════════════════════════
-->
