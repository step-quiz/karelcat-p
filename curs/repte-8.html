  ════════════════════════════════════════════════════════

def pas_vigilant():
    if pearl_here():
        grab()
    if front_is_clear():
        move()
    else:
        turn_right()

drop()
move()

while not pearl_here():
    pas_vigilant()

grab()

  Clau pedagògica: front_is_clear() + turn_right() és suficient per
  seguir un perímetre rectangular. Les quatre cantonades es gestionen
  amb el mateix else. L'ús de drop() com a marcador anticipa el repte 13.
